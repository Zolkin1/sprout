# Data registry: the source of truth for named data artifacts (clip & trajectory
# libraries) this project trains/evaluates against. Each entry records the artifact's
# *identity* (content fingerprint) and, where applicable, where it lives.
#
# Today this is provenance + a verify helper (scripts/rsl_rl/data_registry.py) that
# catches silent local/server divergence by checking a local artifact against its
# recorded fingerprint. A future resolver will pull artifacts by name at the pinned
# `revision` and verify the fingerprint before use (HF Hub). `hf_repo`/`revision` are
# placeholders for clip libraries until that lands.

