#
# The G1 BRAIN, driven by the C++ controller (g1_control_cpp) instead of the python one.
#
# Identical to g1.yml in every other respect: the same shared fragment, the same estimator,
# the same joystick FSM, the same robot-less split (the world or the hardware driver is a
# SEPARATELY launched config on the same ROS graph). Only the control executable changes, so a
# regression between the two controllers is isolated by launching this file instead of g1.yml
# and changing nothing else.
#
# ============================ why this exists at all ======================================
# On a Jetson (aarch64) the python controller cannot reach the GPU. ROS 2 Humble pins the image
# to python 3.10, so rclpy is a cp310 C extension, while the only onnxruntime GPU build that
# runs on a Thor is cp312 -- two C extensions built for different CPython ABIs cannot share a
# process. The python node therefore runs the generator on the CPU at ~471 ms per re-plan tick
# against a 20 ms control period. This one runs it on the GPU at ~16 ms, on its own thread.
#
# Launch:
#   obk-launch config=${ROBOT_RL_ROOT}/g1_control/config/g1_cpp.yml
#
# or, the usual way, which does this for you:
#   scripts/run_sim_low.sh --cpp
config: rl_policy_cpp

include:
  - common/low_level.yml

# Keyed merge: the entry named `low_level` in the fragment, with its executable swapped and the
# C++-only parameters added. `params` MERGES rather than replaces, so everything the fragment
# sets (hf_repo_id, hf_policy_folder, use_cuda, onnx_threads, depth_topics, the timeouts) still
# applies and is not restated here -- restating it is how two configs drift apart.
control:
  - name: low_level
    pkg: g1_control_cpp
    executable: g1_controller
    params:
      # How far BEFORE its cadence boundary the generator is asked for a plan. The cadence
      # itself is NOT here and must never be: it comes from tracker.onnx's metadata and
      # nowhere else, so a parameter for it would read as a live knob that can never take
      # effect (which is exactly what happened to fm_update_every once already).
      #
      # This is two ticks at dt = 0.02. The lead sets TWO things at once, in opposite
      # directions: it is the generator's deadline (n * dt to return a plan) and it is
      # exteroception staleness (the plan is conditioned on the depth image and velocity
      # command as they were at REQUEST time, so n * dt older). Clamped to [1, K-1].
      #
      # Size it against the generator's cost on the box that will run it, measured from
      # `fm_infer_ms` in a bag rather than from an isolated benchmark -- the two differed by
      # ~5 ms here. Per-plan medians measured so far: 14 ms on the x86 desktop, 21 ms on a
      # Jetson Thor, 35 ms on that Thor with TF32 disabled.
      #
      # A plan that misses its boundary is not dropped: the cursor advances and the far window
      # offsets saturate (see deploy_cpp/include/g1_deploy/plan_scheduler.h). `fm_late_events`
      # and `fm_offsets_clamped` in the bag count how often, which is the number to look at
      # when changing this.
      #
      # 0.02 s (ONE tick) is the smallest lead PlanScheduler allows, and was chosen
      # that way because the lead is not latency the way inference time is. It is exteroception
      # STALENESS: the plan is conditioned on the depth image and velocity command as they were
      # at REQUEST time, so every tick of lead hands the generator a camera 20 ms older. At the
      # previous 0.05 (3 ticks) the measured staleness of the image each plan was actually
      # conditioned on was 66 ms mean / 79 ms max, of which 60 ms was the lead alone -- three
      # times every other delay in the stack combined, and ~4.5 cm of egomotion at 0.75 m/s,
      # which on a stair edge is a different problem rather than a rounding difference.
      #
      # The trade is that it no longer comfortably fits the generator. Measured per-plan
      # inference on this GPU is med 13.6 ms with p99 16.2 / max 16.6 on an otherwise quiet
      # box, but a busier run of the same pair reached p99 22.3 / max 22.8 -- so a 20 ms budget
      # is met most of the time and missed under contention. That is priced in, not avoided: a
      # late plan does not stall the reference, because the cursor keeps advancing and served
      # node indices saturate at F-1, which at F=62 clamps ONLY the furthest window offset
      # (the 1 s lookahead) while the node being tracked stays a real prediction. See
      # deploy_cpp/include/g1_deploy/plan_scheduler.h's lateness section, and
      # plan_scheduler_test.cc's OneTickOfLeadRepeatsOnlyTheFurthestOffsetWhenAPlanSlips.
      #
      # So a nonzero `fm_late_events` is now EXPECTED here rather than a fault, and raising
      # this is the wrong first response: it trades a repeated far-horizon sample for 20 ms
      # more blindness. Widen the generator's horizon F instead (retrain with --ref_future_len
      # / --future_len above max_offset + K) and one-tick lateness costs nothing at all. It is
      # clamped to [1, K-1].
      #
      # This value WINS over the C++ declared default, which is also 0.02. The lead a run
      # actually used is in the bag as FmPlan.lead_ticks -- read it there rather than assuming
      # this file was in effect, which is a mistake already made once.
      fm_lead_sec: 0.04

      # The generator on its own thread. false runs it inline, which is what the tests and the
      # benchmark do and which is useful for isolating a threading question from a policy one
      # -- but on this hardware inline means the 50 Hz tick pays 16 ms every twelfth tick.
      threaded_fm: true

      # Ticks of continuous lateness before disarming. 0 = never, which is the deliberate
      # default: a late plan is survivable (the cursor keeps advancing and the far end of the
      # reference window saturates, and the timing line says so), and disarming mid-stride is
      # not obviously safer.
      # Consider ~25 (0.5 s) after the first hardware campaign, when there is data about how
      # often it happens.
      fm_late_disarm_ticks: 0
