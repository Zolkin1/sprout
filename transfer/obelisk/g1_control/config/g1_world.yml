#
# The MuJoCo WORLD, and nothing else -- the simulation counterpart of g1_robot_hw.yml.
# Launched as its own obk-launch alongside the robot-less brain (g1.yml) on the same ROS
# graph, so the SAME controller config runs in sim and on hardware and the world can be
# restarted without cycling the brain.
#
# Launch:
#   obk-launch config=${ROBOT_RL_ROOT}/g1_control/config/g1_world.yml
#
# It publishes exactly the topics the real robot does -- joint encoders, pelvis IMU, the
# depth image, /livox/lidar + /livox/imu -- so nothing downstream can tell the difference.
config: g1_world

robot:
  - name: g1_sim
    is_simulated: True
    pkg: obelisk_unitree_cpp
    executable: obelisk_unitree_sim
    params:
      ic_keyframe: standing
    sim:
      - ros_parameter: mujoco_setting
        # The SAME 29-DoF model the MuJoCo sim2sim runner uses, by absolute path
        # (${VAR} is expanded at launch, and obelisk takes an absolute model_xml_path
        # as-is). Not a copy under g1_model/: a second MJCF is a second set of masses,
        # collision geometry and geom groups to keep in sync, and the whole point of this
        # stack is that the two simulators agree. ROBOT_RL_ROOT is transfer/obelisk.
        model_xml_path: ${ROBOT_RL_ROOT}/../sim/robots/g1/g1_perceptive_terrain_scene.xml
        time_step: 0.001
        num_steps_per_viz: 10
        sensor_settings:
        # ----- Joint encoders ----- #
          - topic: /obelisk/g1/joint_encoders
            dt: 0.002
            msg_type: ObkJointEncoders
            # EVERY MuJoCo sensor, BY NAME. The map key is the sensor's name in the MJCF and
            # the value is its type -- obelisk calls mj_name2id on each key, so the previous
            # `joint_pos: jointpos` / `joint_vel: jointvel` placeholders made the world node
            # fail its configure transition outright ("Sensor not found in Mujoco! Sensor
            # name: joint_pos") and the whole sim came up with no sensors at all.
            #
            # ORDER IS LOAD-BEARING and is not checked anywhere: obelisk fills joint_names
            # from the jointpos entries in this order and appends the jointvel readings in
            # theirs, so mismatched orders silently pair each joint's position with another
            # joint's velocity. Generated from g1_29j.xml's sensor block; regenerate both
            # together. All 29 joints must appear or the controller refuses to arm.
            sensor_names:
            # ---------- Joint positions (order defines joint_names) ---------- #
              left_hip_pitch_joint_pos_sensor: jointpos
              left_hip_roll_joint_pos_sensor: jointpos
              left_hip_yaw_joint_pos_sensor: jointpos
              left_knee_joint_pos_sensor: jointpos
              left_ankle_pitch_joint_pos_sensor: jointpos
              left_ankle_roll_joint_pos_sensor: jointpos
              right_hip_pitch_joint_pos_sensor: jointpos
              right_hip_roll_joint_pos_sensor: jointpos
              right_hip_yaw_joint_pos_sensor: jointpos
              right_knee_joint_pos_sensor: jointpos
              right_ankle_pitch_joint_pos_sensor: jointpos
              right_ankle_roll_joint_pos_sensor: jointpos
              waist_yaw_joint_pos_sensor: jointpos
              waist_roll_joint_pos_sensor: jointpos
              waist_pitch_joint_pos_sensor: jointpos
              left_shoulder_pitch_joint_pos_sensor: jointpos
              left_shoulder_roll_joint_pos_sensor: jointpos
              left_shoulder_yaw_joint_pos_sensor: jointpos
              left_elbow_joint_pos_sensor: jointpos
              left_wrist_roll_joint_pos_sensor: jointpos
              left_wrist_pitch_joint_pos_sensor: jointpos
              left_wrist_yaw_joint_pos_sensor: jointpos
              right_shoulder_pitch_joint_pos_sensor: jointpos
              right_shoulder_roll_joint_pos_sensor: jointpos
              right_shoulder_yaw_joint_pos_sensor: jointpos
              right_elbow_joint_pos_sensor: jointpos
              right_wrist_roll_joint_pos_sensor: jointpos
              right_wrist_pitch_joint_pos_sensor: jointpos
              right_wrist_yaw_joint_pos_sensor: jointpos
            # ---------- Joint velocities, SAME ORDER ---------- #
              left_hip_pitch_joint_vel_sensor: jointvel
              left_hip_roll_joint_vel_sensor: jointvel
              left_hip_yaw_joint_vel_sensor: jointvel
              left_knee_joint_vel_sensor: jointvel
              left_ankle_pitch_joint_vel_sensor: jointvel
              left_ankle_roll_joint_vel_sensor: jointvel
              right_hip_pitch_joint_vel_sensor: jointvel
              right_hip_roll_joint_vel_sensor: jointvel
              right_hip_yaw_joint_vel_sensor: jointvel
              right_knee_joint_vel_sensor: jointvel
              right_ankle_pitch_joint_vel_sensor: jointvel
              right_ankle_roll_joint_vel_sensor: jointvel
              waist_yaw_joint_vel_sensor: jointvel
              waist_roll_joint_vel_sensor: jointvel
              waist_pitch_joint_vel_sensor: jointvel
              left_shoulder_pitch_joint_vel_sensor: jointvel
              left_shoulder_roll_joint_vel_sensor: jointvel
              left_shoulder_yaw_joint_vel_sensor: jointvel
              left_elbow_joint_vel_sensor: jointvel
              left_wrist_roll_joint_vel_sensor: jointvel
              left_wrist_pitch_joint_vel_sensor: jointvel
              left_wrist_yaw_joint_vel_sensor: jointvel
              right_shoulder_pitch_joint_vel_sensor: jointvel
              right_shoulder_roll_joint_vel_sensor: jointvel
              right_shoulder_yaw_joint_vel_sensor: jointvel
              right_elbow_joint_vel_sensor: jointvel
              right_wrist_roll_joint_vel_sensor: jointvel
              right_wrist_pitch_joint_vel_sensor: jointvel
              right_wrist_yaw_joint_vel_sensor: jointvel
        # ----- Pelvis IMU ----- #
          - topic: /obelisk/g1/pelvis_imu
            dt: 0.001
            msg_type: Imu
            sensor_names:
              pelvis_imu_acc_sensor: accelerometer
              pelvis_imu_gyro_sensor: gyro
              pelvis_imu_quat_sensor: framequat
        # ----- Depth camera ----- #
        # Same topic and same message the Jetson ZED node publishes on hardware, so the
        # controller cannot tell them apart. `dt` and the whole scan_config come from the
        # policy's exported contract via scripts/rsl_rl/export_sensor_configs.py -- do not
        # hand-edit config/scan/depth_*.yml, regenerate it.
        #
        # The path form is `config_path:` rather than an inline `scan_config:` because the
        # file is GENERATED: `include:` merges whole top-level sections and cannot splice a
        # fragment into this nested list, so a path is what keeps generated content out of
        # a hand-written file. Inline is otherwise preferred on this obelisk pin.
        #
        # ONE ENTRY PER CAMERA, in the artifact's CONTRACT ORDER -- the controller reads the
        # count from tracker.onnx and refuses to arm if depth_topics does not match it
        # one-to-one. A height-scan policy needs config/scan/height_scan.yml here instead.
        #
        # The topic names are the convention for a TWO-camera policy; the older single
        # /depth/image_processed predates the pair. The Jetson ZED node must publish on these
        # same names on hardware -- see config/scan/zed_targets.yml for what it has to emit.
          - topic: /depth/near/image_processed
            dt: 0.02
            msg_type: DepthImage
            config_path: ${ROBOT_RL_ROOT}/g1_control/config/scan/depth_near.yml
            sensor_names: {depth_near_pos_sensor: framepos}
          - topic: /depth/far/image_processed
            dt: 0.02
            msg_type: DepthImage
            config_path: ${ROBOT_RL_ROOT}/g1_control/config/scan/depth_far.yml
            sensor_names: {depth_far_pos_sensor: framepos}
        # ----- Lidar: simulated MID360 feeding the REAL FAST-LIO ----- #
          - topic: /livox/lidar
            dt: 0.1
            msg_type: PointCloud2
            config_path: ${ROBOT_RL_ROOT}/g1_control/config/scan/mid360.yml
            sensor_names: {head_lidar_pos_sensor: framepos}
          - topic: /livox/imu
            dt: 0.005
            msg_type: Imu
            sensor_names:
              head_lidar_acc_sensor: accelerometer
              head_lidar_gyro_sensor: gyro
              head_lidar_orientation_sensor: framequat
        # ----- Odometry: a GROUND-TRUTH stand-in for FAST-LIO ----- #
        # TODO(sim-odometry): MuJoCo ground truth, published on the topic real localisation
        # owns. On hardware /Odometry is FAST-LIO (config/relocalization/, scan_rate 10) and
        # carries drift, latency and dropouts; this has none of them, so the estimator's
        # dropout path is UNREACHABLE in sim and a policy validated only here has never met
        # its real input.
        #
        # It exists because the `sim` docker target does not build LIO-Localization (that is
        # the `hardware` stage) and OBK_SERVICE defaults to `sim`, so the real stack cannot
        # run here yet. The ingredients are already above: /livox/lidar and /livox/imu are
        # published under their real names for exactly this reason.
        #
        # DELETE THIS ENTRY the day the sim runs FAST-LIO. Two publishers on /Odometry does
        # not error -- the estimator just interleaves ground truth with localisation, which
        # reads as a jittery generator reference. `ros2 topic hz /Odometry` at ~20 instead
        # of ~10 is the tell.
        #
        # Straight onto /Odometry, not a sim-only topic, because g1.yml is launched BYTE
        # IDENTICAL in sim and on hardware; a remap would have to live in the brain, which
        # is the one thing this split exists to prevent.
        #
        # dt 0.1 = the MID360's 10 Hz, which is what FAST-LIO's rate actually is (and what
        # /livox/lidar above already uses); odom_timeout 0.5 leaves 5 frames of margin.
        # Do NOT raise it to make sim feel smoother: the controller ticks at 50 Hz, so
        # base_pos is up to 100 ms stale at each tick and the FM history eats that staleness
        # on the real robot too. Hiding it here is hiding the one thing this cannot model.
        #
        # The twist is BODY frame: obelisk builds it from a velocimeter, which reads in the
        # site frame. That matches low_level.yml's odom_twist_is_body_frame: true.
          - topic: /Odometry
            dt: 0.1
            msg_type: Odometry
            sensor_names:
              base_odom_pos_sensor: framepos
              base_odom_quat_sensor: framequat
              base_odom_vel_sensor: velocimeter
              base_odom_gyro_sensor: gyro
    subscribers:
      - ros_parameter: sub_ctrl_setting
        topic: /obelisk/g1/ctrl
        history_depth: 10
        callback_group: None
      - ros_parameter: sub_fsm_setting
        topic: /obelisk/g1/exec_fsm
        history_depth: 10
        callback_group: None
      - ros_parameter: sub_vel_cmd_setting
        topic: /obelisk/g1/vel_cmd
        history_depth: 10
        callback_group: None

# NOTE: MuJoCo has no execution FSM, so nothing here publishes /obelisk/g1/fsm_state and
# the controller would stay disarmed forever. `g1_control/fsm_state_echo_node.py` echoes
# the joystick's commanded FSM back as the achieved state; the launch scripts start it with
# `ros2 run g1_control fsm_state_echo` alongside this world. It is deliberately NOT an
# obelisk control entry here -- as one it would share a lifecycle and node-name space with
# the brain's real controller, and a cross-config transition then kills a live node.
