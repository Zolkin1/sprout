#
# Shared LOW-LEVEL control base -- the single source of truth for everything that drives
# the G1 low level: the generator+tracker RL controller, the joint/IMU/odom estimator, the
# joystick execution FSM, and the joy_node.  Included by:
#   * config/g1.yml       -- standalone controller, launched IDENTICALLY on hardware and
#                            in sim; only the separately-launched robot config differs.
#
# This is a FRAGMENT: it has no top-level `config:`, so it cannot be launched on its own --
# the including file owns that (and with it the obelisk global_state identity).
#
# Merge rules (obelisk core/utils/launch_utils.load_config_file): list entries KEYED-MERGE
# by the first of name/id/key/ros_parameter/topic, so an includer redeclaring
# `- name: low_level` merges INTO this entry rather than adding a second node; mappings
# (joystick, viz) deep-merge; scalars go to the outermost file.  `${VAR}` expands in string
# values.  The `name:` also becomes the ROS node name (obelisk_control_low_level), so it is
# both the merge identity and what you see in `ros2 node list`.

# --------------------------------- #
# ----------- Controller ---------- #
# --------------------------------- #
control:
# ----- Low-level RL controller (generator + tracker) ----- #
  - name: low_level
    pkg: g1_control
    executable: g1_controller
    params:
      # ---- Policy artifacts ----
      # The robot pulls tracker.onnx + fm.onnx from HuggingFace and reads EVERY deployment
      # parameter out of their metadata: joint order, gains, observation terms and clips,
      # and the depth-camera contract. There is no policy_parameters.yaml any more -- if
      # you find yourself wanting to add one here, the value belongs in the export instead.
      # Must match deploy.hardware.DEFAULT_HF_REPO_ID, which the uploader
      # (scripts/rsl_rl/export_to_hardware.py) and prefetch_policy.py both read. A ROS
      # param cannot import it, so this one restatement is by hand -- change both together.
      hf_repo_id: "zolkin/robot_rl"
      # The PLAN-anchored perceptive pair. It had to move off 2026-08-04_21-55-17_yaw_k12_v1,
      # which is a pre-mode_11 policy: wrong action scale (hip pitch 0.2738 against this
      # robot's 0.1753), placeholder camera mounts, no backpack -- and it LOADS CLEAN, because
      # all 29 joints and their order are unchanged. The C++ runtime additionally refuses that
      # one outright now, since it is robot_now-anchored and this deploy path has no odometry.
      # Override per run with `run_sim_low.sh --policy <folder>` rather than editing this.
      hf_policy_folder: "2026-08-20_16-36-10_mode11_decor_plan_v1"
      use_cuda: true
      # Arm a pair whose robot_asset fingerprints disagree, warning on every load instead of
      # refusing. ON, for one specific and understood delta:
      #
      #   tracker mjcf_sha256 245672ef...  vs  generator 0078e0d0...
      #
      # Commit 3ddab280 (2026-08-24) changed ONE line of g1_perceptive.xml -- the hip-pitch
      # position gains, 40.18/2.56 -> 99.0984/6.3088 -- and nothing else. The generators in use
      # were trained before it. `robot_asset` is baked into an FM CHECKPOINT at training time
      # and is NOT recomputed at export, so re-exporting the generator does not clear this; only
      # retraining would. Actuator gains are never read by the generator, and reach the robot
      # from the TRACKER's metadata over the wire, so the pair is compatible.
      #
      # TURN THIS BACK OFF once the generators are retrained on a tree that carries 3ddab280.
      # It is not a general permission: it also suppresses a joint-order, body-set or link
      # geometry mismatch, which is exactly what the guard exists to catch. The C++ prints
      # every differing field on every load -- read it, and if it is not the gains line above,
      # stop.
      allow_robot_asset_mismatch: true
      # 4, not the onnxruntime default of 0 (auto): auto measured ~3x SLOWER here (the FM at
      # 251 ms vs 87 ms on the 27M). Revisit per machine -- this is a measured local optimum,
      # not a portable constant.
      onnx_threads: 4

      # ---- Exteroception ----
      # One topic per depth camera, in the artifact's CONTRACT ORDER. The controller
      # cross-checks the count against tracker.onnx's depth_camera_spec and refuses to arm
      # on a mismatch, so a policy trained on two cameras cannot be run on one by accident.
      # Leave empty for a height-scan or blind policy.
      depth_topics: ["/depth/near/image_processed", "/depth/far/image_processed"]
      # Zero the velocity command if no depth frame arrives within this many seconds
      # (<=0 disables). Judged on LOCAL RECEIPT time, not the header stamp: the camera
      # clock is not synchronised to this machine.
      #
      # What this does NOT do, because it cannot: the policy keeps reading the LAST frame,
      # so the robot is still planning and tracking against an image that has stopped
      # describing the world. Zeroing asks it to come to a stop; it is not a recovery. The
      # camera buffer is only ever overwritten by a new frame, so a dead camera stays frozen
      # for as long as it is dead -- on the ZED pair that is a respawn_delay of 10 s plus the
      # 25-30 s sl::Camera::close() takes to release the device.
      #
      # 0.15 = 7.5 ticks at the 0.02 s control period. Chosen against what the GENERATOR was
      # trained on, not against the camera's frame interval: `depth_latency_probs` gives the
      # deployed checkpoint support over {20, 40, 60} ms of lag, capped at 3 steps by
      # DEPTH_LAG_STEPS, so 60 ms is the oldest frame it has ever seen. Everything past that
      # is out of distribution however healthy the camera looks, and a prior measurement on
      # the two-box split put a failure cliff between 20 and 40 ms of staleness.
      #
      # It is a compromise and not a bound: 0.15 still trips at 2.5x the largest trained lag.
      # The floor is set by the ARRIVAL GAP, since this is judged on receipt -- the ZED pair
      # runs at 47.2 / 47.7 Hz, so 0.15 tolerates about seven consecutive dropped frames
      # before firing, and a threshold near 60 ms would fire on ordinary jitter. Note the
      # measured `depth_capture_age` of 53.7 / 36.9 ms does NOT enter this test: that is
      # pipeline latency, a roughly constant offset on every frame, not a gap between them.
      depth_timeout: 0.15
      # Likewise if no velocity command arrives -- a dead high level must not leave the
      # robot walking at the last commanded speed.
      vel_cmd_timeout: 1.0

      # ---- Commanded-velocity envelope ----
      # THE LIMIT lives here, in the controller, and the joystick's `v_*_scale` below is the
      # STICK MAPPING. They are different things and the split is deliberate:
      #   * a scale is symmetric by construction (the axis is [-1, 1]), so it cannot express
      #     "0.8 forward, 0.4 back" at all;
      #   * a scale constrains the JOYSTICK only, while /obelisk/g1/vel_cmd is equally
      #     reachable by the scripted node and by any future high-level planner.
      # Backwards is held to half of forwards because the generator has two forward-facing
      # cameras and nothing behind it: reversing is the one direction where it cannot see the
      # ground it is about to step onto.
      vel_cmd_x_min: -0.4
      vel_cmd_x_max: 0.8
      vel_cmd_y_abs_max: 0.0
      vel_cmd_yaw_abs_max: 0.6

      # ---- Bring-up ----
      # There is no PD warm-up, and the runtime no longer has a way to add one. On entering
      # low-level control whatever feeds the tracker -- the generator or a debug clip --
      # drives it from the first tick, which is what the MuJoCo sim2sim runner does and what
      # the policy was trained for. The warm-up paths were deleted outright: every one of
      # them put the robot in a state no training episode started from, and fed the
      # generator's history rows of zeros instead of letting the learned null-history
      # embedding cover the first N steps.

      # ---- Logging ----
      # Diagnostic topics: /obelisk/g1/debug/tick every control step and
      # /obelisk/g1/debug/fm_plan on every generator re-plan, carrying the quantities that
      # exist only inside a tick. The launchers record them, and everything else the policy
      # reads, to an MCAP bag. See "Observability" in transfer/obelisk/README.md.
      #
      # ~330 kB/s. Turn it off only if the latency line says publishing is eating the
      # control period -- a run that was not recorded cannot be explained afterwards.
      debug_topics: true
      # Promotes the 5 s latency line from warn-on-over-budget to always.
      verbose: false
    publishers:
      - ros_parameter: pub_ctrl_setting
        topic: /obelisk/g1/ctrl
        history_depth: 10
        callback_group: None
    subscribers:
      - ros_parameter: sub_est_setting
        topic: /obelisk/g1/est_state
        history_depth: 10
        callback_group: None
      - ros_parameter: sub_vel_cmd_setting
        topic: /obelisk/g1/vel_cmd
        history_depth: 10
        callback_group: None
      # ----- Arming: the robot's ACTUAL execution-FSM state ----- #
      # The controller arms only while this reads LOW_LEVEL_CONTROL (USER_CTRL = 3), never
      # on a button press -- a latched button can disagree with the robot. On hardware the
      # G1 interface publishes it; in sim the echo node in g1_world.yml does, on the same
      # topic, so this subscription is identical either way.
      - ros_parameter: sub_fsm_state_setting
        topic: /obelisk/g1/fsm_state
        history_depth: 10
        callback_group: None
    timers:
      - ros_parameter: timer_ctrl_setting
        timer_period_sec: 0.02    # 50 Hz; the tracker's own dt is asserted against this
        callback_group: None

# ----- Execution FSM + teleop (joystick) ----- #
  # Obelisk's stock unitree joystick node: it drives the robot's execution FSM (damping /
  # user_pose / low_level_control / estop) and turns the sticks into a velocity command.
  # Default pub_ctrl topic is the direct one; a stack with a high-level node in the loop
  # keyed-merges `- name: joystick_fsm` to relay it somewhere else instead.
  - name: joystick_fsm
    pkg: obelisk_unitree_cpp
    executable: obelisk_unitree_joystick
    params:
      # The stick MAPPING, not the limit -- see the envelope in the controller params above,
      # which is what actually bounds the command. Forward full-stick is 0.8 and yaw
      # full-stick is 0.6, so those two sticks reach exactly the envelope's edge and no
      # further; full-stick BACKWARD asks for -0.8 and the envelope clamps it to -0.4, which
      # is the asymmetry a scale cannot express on its own.
      v_x_scale: 0.8
      v_y_scale: 0.0
      w_z_scale: 0.6
      # Yaw on the RIGHT STICK HORIZONTAL (RX = 3 + AXIS_OFFSET). The upstream default is RY
      # -- right stick VERTICAL -- which reads as "yaw does nothing" to anyone who pushes the
      # stick sideways expecting to turn.
      vel_cmd_yaw: 13
    publishers:
      - ros_parameter: pub_exec_fsm_setting
        topic: /obelisk/g1/exec_fsm
        history_depth: 10
        callback_group: None
      - ros_parameter: pub_ctrl_setting
        topic: /obelisk/g1/vel_cmd
        history_depth: 10
        callback_group: None
      - ros_parameter: pub_joy_passthrough_setting
        topic: /obelisk/g1/joy_passthrough
        history_depth: 10
        callback_group: None
    subscribers:
      - ros_parameter: sub_est_setting
        topic: /obelisk/g1/joy
    timers:
      - ros_parameter: timer_ctrl_setting
        timer_period_sec: 0.1
        callback_group: None

# --------------------------------- #
# ----------- Estimator ----------- #
# --------------------------------- #
estimation:
  - name: g1_estimator
    pkg: g1_control
    executable: g1_estimator
    params:
      # The FM history tokens need the base's WORLD-frame linear velocity. nav_msgs/Odometry
      # carries pose in the header frame but twist in the CHILD frame, so FAST-LIO's twist is
      # body-frame and is rotated by the base quaternion before publishing. Set false only if
      # the odometry source is already publishing a world-frame twist.
      odom_twist_is_body_frame: true
      # How stale odometry may be before the estimator flags it. Losing localisation does not
      # stop the robot on its own -- it makes the FM history wrong, which is worse -- so the
      # controller treats a flagged estimate the same as a sensor dropout.
      odom_timeout: 0.5
    publishers:
      - ros_parameter: pub_est_setting
        topic: /obelisk/g1/est_state
        msg_type: EstimatedState
        history_depth: 10
        callback_group: None
    subscribers:
      - ros_parameter: sub_joint_encoders
        topic: /obelisk/g1/joint_encoders
        msg_type: ObkJointEncoders
        history_depth: 10
        callback_group: None
      - ros_parameter: sub_pelvis_imu
        topic: /obelisk/g1/pelvis_imu
        msg_type: Imu
        history_depth: 10
        callback_group: None
      # FAST-LIO odometry: the only source of base POSITION and world linear velocity.
      # Unlike a blind proprioceptive policy, the generator cannot run without it.
      - ros_parameter: sub_odom
        topic: /Odometry
        msg_type: Odometry
        history_depth: 10
        callback_group: None
    timers:
      - ros_parameter: timer_est_setting
        timer_period_sec: 0.001
        callback_group: None

# --------------------------------- #
# ----------- Joystick ------------ #
# --------------------------------- #
# The stock joy_node, identical in every stack. Deep-merges, so an includer can override a
# single field (device_id is host-specific) without redeclaring the block.
joystick:
  on: True
  device_id: 0
  pub_topic: /obelisk/g1/joy
  sub_topic: /obelisk/g1/joy_feedback

# --------------------------------- #
# -------------- Viz -------------- #
# --------------------------------- #
# Robot-state visualisation, off by default. `scripts/run_sim_low.sh --rviz` flips it on with
# a temp overlay that sets ONLY the scalar `viz: {on: True}` -- see obk_viz_config.
#
# Turning it on launches THREE processes, all from obelisk's own bringup: the viz node below
# (est_state -> joint_states + the odom_frame->pelvis transform), a robot_state_publisher fed
# the URDF at `<robot_pkg>/urdf/<urdf>` (joint_states -> every link's TF), and rviz2 with the
# config named here. Nothing needs a tmux pane of its own.
#
# Everything below `viz_nodes:` must stay HERE rather than in an overlay: the list entries
# carry no name/id/key/ros_parameter/topic, so obelisk has no merge identity for them and an
# includer that redeclares one APPENDS a second viz node instead of merging into this one.
# Mappings (`on:`, `rviz_pkg:`, `rviz_config:`) do deep-merge, which is why the flag can flip
# `on` and nothing else.
#
# The FM plan ribbon that the rviz config subscribes to is a SEPARATE node, not part of this
# block: `ros2 run g1_control fm_plan_viz`. --rviz starts it too.
viz:
  on: False
  rviz_pkg: g1_control
  rviz_config: g1_deploy.rviz
  viz_nodes:
    # Upstream's, not the local robot_viz package -- which is an unreferenced fork of this
    # header, identical except for one string: it parents the base transform to "odom_frame"
    # where upstream uses "world". Upstream wins, so "world" is what g1_deploy.rviz's fixed
    # frame and fm_plan_viz's frame_id parameter must both be. Switch the executable and all
    # three have to move together, or the robot renders at the origin and the plan does not
    # render at all -- with no error from anything.
    - pkg: obelisk_viz_cpp
      executable: default_robot_viz
      robot_pkg: g1_model
      # The TRAINED robot, generated from its URDF by g1_model/urdf/make_ros_urdf.py. It said
      # g1_29j.urdf until the training refresh landed, which drew a robot with Dex3 hands, no
      # backpack, no camera mounts and its torso 10 mm high -- and depth_cloud_viz publishes in
      # the torso_link frame, so its cloud inherited that 10 mm relative to the drawn robot.
      urdf: g1_perceptive.urdf
      robot_topic: robot_description
      # The ros_parameter names are NOT free-form: obelisk strips the `_setting` suffix to get
      # a `key`, and matches it against the keys ObeliskVizRobot registers in its constructor
      # -- `sub_est`, `pub_viz_joint`, `time_joints`. This block previously said
      # `sub_viz_est_setting` and `timer_viz_joint_setting` (the pre-rewrite schema's names),
      # which resolve to keys nothing registers, and the node died on configure with
      # "Entry is missing required field 'topic'" -- an error about the entry it did NOT find,
      # naming a field that was present in the one it should have. It went unnoticed because
      # `on: False` meant this block had never been launched.
      subscribers:
        - ros_parameter: sub_est_setting
          topic: /obelisk/g1/est_state
          history_depth: 10
          callback_group: None
      publishers:
        - ros_parameter: pub_viz_joint_setting
          topic: joint_states
          history_depth: 10
          callback_group: None
      timers:
        - ros_parameter: time_joints_setting
          timer_period_sec: 0.01
          callback_group: None
