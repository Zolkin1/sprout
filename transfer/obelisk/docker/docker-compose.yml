x-common: &common
  shm_size: '12gb'
  network_mode: host
  ipc: host
  environment:
    NVIDIA_DRIVER_CAPABILITIES: all
    DISPLAY: $DISPLAY
    USER: $USER
    UID: $UID
    GID: $GID
    QT_X11_NO_MITSHM: 1
    ROBOT_RL_ROOT: $ROBOT_RL_ROOT
    # Repo root, so the container can reach transfer/deploy and transfer/sim. The
    # controller imports the shared deploy runtime from there rather than vendoring a copy.
    REPO_ROOT: $REPO_ROOT
    # ssh target for the Jetson depth node, read INSIDE the container by
    # scripts/lib/obk_launch.sh. Set in docker/.env.
    OBK_JETSON_HOST: $OBK_JETSON_HOST
    OBK_JETSON_CONTAINER: ${OBK_JETSON_CONTAINER:-zed_depth}
    # Cyclone DDS discovery override, EMPTY BY DEFAULT so nothing changes for a single-box
    # run. Set it in docker/.env to a file:// path when the world runs on another machine
    # over a link that will not carry multicast (wifi with client isolation, a routed hop, a
    # multi-homed box). See docker/cyclonedds.xml.example, and note that `obk` does not touch
    # this variable, so it composes with the RMW/domain it does set.
    CYCLONEDDS_URI: ${CYCLONEDDS_URI:-}
    # TF32 off/on for every CUDA matmul in both networks. EMPTY BY DEFAULT, which leaves the
    # driver default (TF32 ON for Ampere and later). Set it to 0 in docker/.env to disable.
    #
    # It is here because TF32 makes the generator's output GPU-ARCHITECTURE DEPENDENT, and by
    # more than a rounding error. Measured on one recorded 540-tick stream, replayed through
    # the same graph and the same onnxruntime on an x86 desktop and on a Jetson Thor: the
    # sampled reference window differs by 1.37e-2 with TF32 on, and by 1.60e-5 with it off on
    # both. Everything upstream of the network -- the observation vector, the depth row, the
    # whole FM conditioning -- is bit-identical either way, so this is entirely inside the
    # matmuls, compounded through 8 Euler steps of a 27M parameter model. Mixed settings
    # across two machines measured 1.44e-2 (on/off) and 1.55e-2 (off/on).
    #
    # Cost, per plan at p99: 20.9 -> 34.3 ms on the Thor, 14.1 -> 14.8 on the x86 desktop.
    # No behavioural effect of the 1.37e-2 has been measured either way.
    NVIDIA_TF32_OVERRIDE: ${NVIDIA_TF32_OVERRIDE:-}
  security_opt:
    - seccomp=unconfined
  cap_add:
    - NET_ADMIN
  volumes:
    # Mount the whole REPO, not just transfer/obelisk. The controller imports
    # transfer/deploy (the runtime it shares with the MuJoCo sim2sim) and the world config
    # loads transfer/sim/robots/g1/*.xml; with only $ROBOT_RL_ROOT mounted, neither exists
    # inside the container.
    - $REPO_ROOT:$REPO_ROOT
    - /tmp/.X11-unix:/tmp/.X11-unix
    - $HOME/.Xauthority:$HOME/.Xauthority:rw
    - $HOME/.gitconfig:$HOME/.gitconfig
    - $HOME/.ssh:$HOME/.ssh
    # NO $HOME/.bashrc. It used to be mounted and it bought nothing: `obk` comes from
    # ~/.bash_aliases, which obelisk's setup writes INTO the image, and the image's own
    # stock ~/.bashrc already sources it. What the host file added was arbitrary host
    # state -- and a stale `export ROBOT_RL_ROOT` in it silently broke EVERY tmux pane of
    # EVERY run script (the workspace went unsourced, surfacing much later as ros2 launch
    # reporting "package 'g1_control' not found"). It also injected whatever else lives in
    # a developer's shell profile, secrets included, into every process in the container.
    # obk_mk_rcfile re-asserts the container's paths after ~/.bashrc regardless, so this is
    # belt and braces -- but the mount is the part that made the class of bug possible.
    # Joystick / input devices, so joy_node finds the controller at all.
    - /dev/input:/dev/input
    # udev runtime dir, so SDL2's libudev hotplug monitor INSIDE the container sees the
    # pad re-attach after it sleeps or is unplugged. Without this, joy_node misses the
    # re-add and never picks the controller back up -- you have to restart the stack.
    - /run/udev:/run/udev:ro
  # Join the host 'input' group so the non-root container user can READ /dev/input/event*
  # (root:input, mode 660) without the `sudo chmod 666` ritual. GIDs are HOST-SPECIFIC:
  #     getent group input   | cut -d: -f3
  #     getent group dialout | cut -d: -f3
  # and go in docker/.env.
  group_add:
    - "${INPUT_GID:-107}"
    - "${DIALOUT_GID:-20}"
  ports:
    - 7007:7007
    - 10000:10000
  runtime: nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  working_dir: $ROBOT_RL_ROOT
  stdin_open: true
  tty: true
  command: /bin/bash

services:
  sim:
    <<: *common
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile
      target: sim
      args:
        USER: $USER
        UID: $UID
        GID: $GID
        ROBOT_RL_ROOT: $ROBOT_RL_ROOT

  hardware:
    <<: *common
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile
      target: hardware
      args:
        USER: $USER
        UID: $UID
        GID: $GID
        ROBOT_RL_ROOT: $ROBOT_RL_ROOT
