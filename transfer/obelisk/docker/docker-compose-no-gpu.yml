# Identical to docker-compose.yml minus `runtime: nvidia` and the GPU reservation, which
# docker can only honour when the nvidia container runtime is registered. The launch
# scripts auto-select this file when `docker info` shows no nvidia runtime.
#
# THIS FILE NO LONGER MEANS "a working CPU deployment". The image ships onnxruntime-GPU
# either way (docker/requirements.txt), so the wheel still advertises a CUDA provider here
# and nothing at install time notices the GPU is missing; the session simply falls back to
# the CPU at load. What catches that is G1Controller._require_cuda, which refuses to run
# rather than miss the control period by 5x -- so with the default `use_cuda: true` the
# controller will REFUSE TO START under this file. That is deliberate: the generator pair
# measures 103.5 ms per replan tick on CPU against a 20 ms budget, which is not a degraded
# mode, it is an unusable one. Running here at all takes a deliberate `use_cuda:=false`
# AND a plan for the deficit (a smaller generator, or a longer control period).
x-common: &common
  shm_size: '12gb'
  network_mode: host
  ipc: host
  environment:
    NVIDIA_DRIVER_CAPABILITIES: all
    DISPLAY: $DISPLAY
    USER: $USER
    UID: $UID
    GID: $GID
    QT_X11_NO_MITSHM: 1
    ROBOT_RL_ROOT: $ROBOT_RL_ROOT
    REPO_ROOT: $REPO_ROOT
    OBK_JETSON_HOST: $OBK_JETSON_HOST
    OBK_JETSON_CONTAINER: ${OBK_JETSON_CONTAINER:-zed_depth}
    # See the note in docker-compose.yml. Empty by default; docker/cyclonedds.xml.example
    # explains when a split-machine run needs it.
    CYCLONEDDS_URI: ${CYCLONEDDS_URI:-}
    # TF32 off/on for every CUDA matmul in both networks. EMPTY BY DEFAULT, which leaves the
    # driver default (TF32 ON for Ampere and later). Set it to 0 in docker/.env to disable.
    #
    # It is here because TF32 makes the generator's output GPU-ARCHITECTURE DEPENDENT, and by
    # more than a rounding error. Measured on one recorded 540-tick stream, replayed through
    # the same graph and the same onnxruntime on an x86 desktop and on a Jetson Thor: the
    # sampled reference window differs by 1.37e-2 with TF32 on, and by 1.60e-5 with it off on
    # both. Everything upstream of the network -- the observation vector, the depth row, the
    # whole FM conditioning -- is bit-identical either way, so this is entirely inside the
    # matmuls, compounded through 8 Euler steps of a 27M parameter model. Mixed settings
    # across two machines measured 1.44e-2 (on/off) and 1.55e-2 (off/on).
    #
    # Cost, per plan at p99: 20.9 -> 34.3 ms on the Thor, 14.1 -> 14.8 on the x86 desktop.
    # No behavioural effect of the 1.37e-2 has been measured either way.
    NVIDIA_TF32_OVERRIDE: ${NVIDIA_TF32_OVERRIDE:-}
  security_opt:
    - seccomp=unconfined
  cap_add:
    - NET_ADMIN
  volumes:
    # The whole repo: the controller imports transfer/deploy and the world config loads
    # transfer/sim/robots/g1/*.xml. See docker-compose.yml for the full rationale.
    - $REPO_ROOT:$REPO_ROOT
    - /tmp/.X11-unix:/tmp/.X11-unix
    - $HOME/.Xauthority:$HOME/.Xauthority:rw
    - $HOME/.gitconfig:$HOME/.gitconfig
    - $HOME/.ssh:$HOME/.ssh
    # No $HOME/.bashrc here either -- see docker-compose.yml for why it was removed.
    - /dev/input:/dev/input
    # Joystick hot-reconnect: without this, joy_node misses the re-add when the pad wakes.
    - /run/udev:/run/udev:ro
  group_add:
    - "${INPUT_GID:-107}"
    - "${DIALOUT_GID:-20}"
  ports:
    - 7007:7007
    - 10000:10000
  working_dir: $ROBOT_RL_ROOT
  stdin_open: true
  tty: true
  command: /bin/bash

services:
  sim:
    <<: *common
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile
      target: sim
      args:
        USER: $USER
        UID: $UID
        GID: $GID
        ROBOT_RL_ROOT: $ROBOT_RL_ROOT

  hardware:
    <<: *common
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile
      target: hardware
      args:
        USER: $USER
        UID: $UID
        GID: $GID
        ROBOT_RL_ROOT: $ROBOT_RL_ROOT
