# Identical to docker-compose.yml minus `runtime: nvidia` and the GPU reservation, which
# docker can only honour when the nvidia container runtime is registered. The launch
# scripts auto-select this file when `docker info` shows no nvidia runtime -- the onboard
# minipc has no GPU, and the deploy path is CPU onnxruntime anyway.
x-common: &common
  shm_size: '12gb'
  network_mode: host
  ipc: host
  environment:
    NVIDIA_DRIVER_CAPABILITIES: all
    DISPLAY: $DISPLAY
    USER: $USER
    UID: $UID
    GID: $GID
    QT_X11_NO_MITSHM: 1
    ROBOT_RL_ROOT: $ROBOT_RL_ROOT
    REPO_ROOT: $REPO_ROOT
    OBK_JETSON_HOST: $OBK_JETSON_HOST
    OBK_JETSON_CONTAINER: ${OBK_JETSON_CONTAINER:-zed_depth}
  security_opt:
    - seccomp=unconfined
  cap_add:
    - NET_ADMIN
  volumes:
    # The whole repo: the controller imports transfer/deploy and the world config loads
    # transfer/sim/robots/g1/*.xml. See docker-compose.yml for the full rationale.
    - $REPO_ROOT:$REPO_ROOT
    - /tmp/.X11-unix:/tmp/.X11-unix
    - $HOME/.Xauthority:$HOME/.Xauthority:rw
    - $HOME/.bashrc:$HOME/.bashrc
    - $HOME/.gitconfig:$HOME/.gitconfig
    - $HOME/.ssh:$HOME/.ssh
    - /dev/input:/dev/input
    # Joystick hot-reconnect: without this, joy_node misses the re-add when the pad wakes.
    - /run/udev:/run/udev:ro
  group_add:
    - "${INPUT_GID:-107}"
    - "${DIALOUT_GID:-20}"
  ports:
    - 7007:7007
    - 10000:10000
  working_dir: $ROBOT_RL_ROOT
  stdin_open: true
  tty: true
  command: /bin/bash

services:
  sim:
    <<: *common
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile
      target: sim
      args:
        USER: $USER
        UID: $UID
        GID: $GID
        ROBOT_RL_ROOT: $ROBOT_RL_ROOT

  hardware:
    <<: *common
    privileged: true
    build:
      context: .
      dockerfile: Dockerfile
      target: hardware
      args:
        USER: $USER
        UID: $UID
        GID: $GID
        ROBOT_RL_ROOT: $ROBOT_RL_ROOT
