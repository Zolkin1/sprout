# Jetson Orin container holding the ZED depth node.
#
# ONE idle container (bash + tty); the node is launched into a detached container-side tmux
# by run_node.sh, either by hand or -- normally -- by the onboard stack over ssh
# (scripts/lib/obk_launch.sh's obk_jetson_zed_cmd). Running it in its own tmux is what lets
# a flaky ssh link drop without taking the camera down.
#
# Usage (on the Jetson):
#   # one-time: make the nvidia runtime the default in /etc/docker/daemon.json
#   #   { "default-runtime": "nvidia", "runtimes": { "nvidia": { "path": "nvidia-container-runtime" } } }
#   cp .env_example .env && $EDITOR .env
#   docker compose build && docker compose up -d
#   docker exec -it zed_depth run_node.sh zed        # or let the onboard launcher do it

# Explicit project name. Without one compose derives it from the DIRECTORY, which is
# `docker` -- and transfer/obelisk/docker is also `docker`, so the two projects would share
# a namespace and a `docker compose down` in either could reap the other's containers.
name: zed_depth

services:
  zed_depth:
    image: jetson_zed_depth:${IMAGE_TAG:-jp6.2}
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile.jp6.2}
      args:
        ZED_USER: ${ZED_USER:-unitree}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        ZED_IMAGE: ${ZED_IMAGE:-stereolabs/zed:4.2-devel-jetson-jp6.2}
        ZED_REF: ${ZED_REF:-23ef4fa709652614d385daa355e917c2ca9ea34f}
    container_name: zed_depth          # predictable `docker exec -it zed_depth ...`
    runtime: nvidia                    # the ZED SDK needs the GPU
    network_mode: host                 # DDS discovery across the jetson and the minipc
    ipc: host
    privileged: true                   # ZED USB + tegra device access
    # Run as root: the Jetson GPU/nvmap device nodes are root:video 660, so a non-root user
    # cannot initialise CUDA (NvRmMemInit / cuInit fail). HOME keeps ~ on the built workspace.
    # Root also covers /dev/spsc_bmi* (the ZED X IMU), which udev gives to group `imu` -- the
    # SDK treats a missing IMU as a FATAL open failure, not a degraded one.
    user: root
    # ROS_DOMAIN_ID / RMW_IMPLEMENTATION come from .env via env_file -- read VERBATIM --
    # NOT via ${} interpolation under `environment:`. Compose precedence is shell > .env, so
    # with interpolation a stray `export ROS_DOMAIN_ID=0` in the Jetson login shell would
    # silently put the camera on a different graph from the controller, and the only symptom
    # would be a depth watchdog timeout on the robot. Keys listed under `environment:`
    # override env_file, so ROS_DOMAIN_ID and RMW must NOT appear there.
    env_file:
      - .env
    environment:
      HOME: /home/${ZED_USER:-unitree}
    volumes:
      - /dev:/dev                       # ZED USB enumeration
      # GMSL ZED X only: the SDK opens the camera through Argus, which talks to the host's
      # nvargus-daemon over a socket at the hardcoded path /tmp/argus_socket. Not needed for a
      # USB ZED 2i / Mini.
      #
      # The HOST'S WHOLE /tmp, deliberately, and not `- /tmp/argus_socket:/tmp/argus_socket`
      # as NVIDIA's own examples show. Bind-mounting the socket FILE pins the container to
      # that inode, and nvargus-daemon deletes and recreates the socket every time it
      # restarts -- so one daemon restart leaves the container talking to a deleted inode
      # FOREVER. It fails as `Connecting to nvargus-daemon failed: Connection refused`, which
      # names Argus and never mentions the mount, and it does not heal: only recreating the
      # container does. That is not hypothetical here -- nvargus took a SIGBUS
      # (`code=killed, status=7/BUS`) during bring-up on this box. Mounting the directory
      # lets the container follow the new inode on its own.
      #
      # The blast radius is unchanged in practice: this container is already privileged, on
      # host networking and host IPC, with all of /dev.
      - /tmp:/tmp
      # The timing tools, bind-mounted rather than baked in: they are diagnostics that get
      # edited between runs, and rebuilding a multi-GB image to change a percentile is not a
      # loop anyone will actually use. Read-only -- nothing in here writes to the repo.
      - ../tools:/opt/zed_tools:ro
      # The per-camera node params. Bind-mounted for the same reason as the tools, and
      # because the FoV/range numbers in them answer to a policy artifact rather than to
      # this image -- they change when the tracker does, not when the container does.
      - ../config:/opt/zed_config:ro
      - ../launch:/opt/zed_launch:ro
      # Persist the SDK's optimised NEURAL engines, so they are not rebuilt (minutes) on
      # every container start.
      - zed_resources:/usr/local/zed/resources
      # Persist the per-camera factory calibration (settings/SN<serial>.conf). SEPARATE from
      # the models above and unique to the camera's serial. The SDK downloads it from
      # stereolabs.com on first open -- but the robot LAN has no DNS, so without this volume
      # it is wiped by any `down`/recreate and CANNOT be re-fetched: camera open then hangs
      # ~20 s and fails. See seed_zed_calib.sh.
      - zed_settings:/usr/local/zed/settings
    command: /bin/bash
    stdin_open: true
    tty: true
    restart: unless-stopped            # survives a reboot; bash+tty will not crash-loop

volumes:
  zed_resources:
  zed_settings:
