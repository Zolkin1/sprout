# The near depth camera: ZED X Mini, serial 59249806 -- the LOWER of the two mounts.
#
# `/**` and not the node name: both cameras run the same executable under remapped names
# (zed_near / zed_far), and a params file keyed by node name applies to NOTHING once the node
# is renamed -- silently, with every default left in place.
#
# Topics are the deployment contract, not a choice: g1_world.yml subscribes to
# /depth/{near,far}/image_processed and the controller refuses to arm when the topic count
# disagrees with tracker.onnx.
#
# MEASURED on zed-box-2 (Orin NX, SDK 5.2.3), both cameras concurrent, through this node:
#   44.7 Hz/camera, capture->subscriber median 41.9 ms, p90 48.3, p99 53.8.
# SVGA because HD720 is a USB-camera mode no GMSL ZED X can open, and HD1200 halves to
# 15.7 Hz with both cameras running. NEURAL_LIGHT because NEURAL is 19.2 Hz concurrent.
# fps 120 is worth 13.4 ms of LATENCY at unchanged rate: the GPU still makes only ~45 depth
# maps/s, but the frame it picks up is much younger. Pipeline depth scales with the frame
# PERIOD, which is why fps 30 is 21 ms worse rather than better.
# depth_stabilization stays at 30 for now; 0 would give 50.4 Hz and ~1.4 ms less, and is
# arguably closer to training (the sim noise model has no temporal filter). Revisit.
#
# GEOMETRY comes from the policy, not from this camera. Derived by
#   export_sensor_configs.py --run_dir <run>   ->  zed_targets.yml
# from tracker.onnx of `TEMP_mode11_decor_lag48_aug_NOT_HW_READY`:
#   near: 100 x 70 deg, 30x26, range 0.1-7.9 m, 50 Hz.
# The native cone at SVGA is 106.2 x 79.5 deg, so this crops to a 859x505
# px ROI with room to spare. clip_fov only CROPS -- a target wider than the native cone
# silently clamps to the image bounds instead of failing.
#
# TODO(policy): that checkpoint is named TEMP and NOT_HW_READY. Re-derive from the real one
# before flying; the numbers move only if the camera configuration changed, but that is a
# check, not an assumption.
#
# An invalid pixel needs NO handling here: the SDK's NaN/inf passes straight through and the
# CONTROLLER's normalize_depth_np maps every invalid class -- too near, beyond range,
# non-finite, dropped -- onto the contract's sentinel (0 m for both cameras).
/**:
  ros__parameters:
    depth_topic: "depth/near/image_raw"
    camera_info_topic: "depth/near/camera_info"
    processed_depth_topic: "depth/near/image_processed"
    processed_camera_info_topic: "depth/near/camera_info_processed"
    frame_id: "zed_near_frame"

    # Which camera. A serial names a DEVICE; gmsl_port names a MOUNTING POSITION and so
    # survives a camera swap -- prefer the port once the pair is physically fixed, since
    # near/far are positions. Without either, the SDK opens the first available camera and
    # which one is 'near' is a coin flip across restarts.
    serial_number: 59249806
    # CONFIRMED by the operator: the ZED X Mini is the NEAR camera and looks 65 deg
    # down; the ZED X is the upper/FAR mount. Consistent with the contract geometry
    # -- this policy's contract mounts both on torso_link_origin_site with near at
    # z=0.045 tilted 65 deg and far at z=0.285 tilted 15 deg, i.e. far sits 24 cm HIGHER.
    # This box needs the ROLE and nothing more: the mount offsets are
    # consumed by g1_deploy::CameraPoseFk in the CONTROLLER, which FKs them from the URDF
    # and the encoders. This node knows no mount geometry, and zed_targets() deliberately
    # emits no extrinsics -- only shape, FoV, range, sentinel and rate reach here.
    # Both cameras share a native cone here (106.2 x 79.5 deg), so a transposed pair
    # is invisible in the imagery and the topic-count check cannot see it either.

    resolution: "SVGA"
    fps: 120
    depth_mode: "NEURAL_LIGHT"
    depth_min_distance: 0.1       # contract min_range_m
    depth_max_distance: 7.9       # contract max_range_m
    coordinate_units: "METER"
    depth_stabilization: 30
    depth_encoding: "32FC1"

    confidence_threshold: 95
    texture_confidence_threshold: 100
    publish_raw: false

    gaussian_blur:
      enabled: false
      kernel_radius: 4

    clip_fov:                      # contract hfov_deg / vfov_deg
      enabled: true
      horizontal_fov_deg: 100.0
      vertical_fov_deg: 70.0

    downsample:                    # contract width / height
      enabled: true
      width: 30
      height: 26
      method: "mean"
      alpha: 0.5
