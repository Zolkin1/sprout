#
# Clip-library recipe for scripts/rsl_rl/generate_mb_library.py.
#
# This file IS the library's definition: every distribution and scale knob lives here, nothing
# is defaulted behind your back, and a library is reproducible from (this file + --source + --seed).
# The driver forwards EVERY value below to the stage that consumes it, so the sub-scripts' own
# argparse defaults never apply to a driver run -- that is deliberate, because a default declared in
# two places is a default that drifts (it already did: the driver used to redeclare the velocity
# bands with stale floors and silently override mb_plan_library).
#
# Loading is STRICT: an unknown key or a missing key is an error, never a silent default. A typo in
# a distribution parameter is otherwise invisible until you measure the finished library.
#
# Full scale: 20+20 transition + 15+15 pure stairs + 20/15/15 box + 60 flat tiles, x 50 clips.

# ---------------------------------------------------------------- reproducibility
seed: 0

# ---------------------------------------------------------------- scale (tiles x clips)
clips_per_tile: 50
stair_tiles: 26                 # TRANSITION stair tiles per direction (up/down)
pure_stair_tiles: 15            # PURE stair tiles per direction (one long staircase, no approach)
box_tiles: [24, 15, 19]         # jump_on, jump_off, jump_off_front
# The 20 tiles the distractor family used to hold went to TERRAIN, because a tile is how the RL and
# the FM see geometry: each one carries its own corridor width, platform widths, step count,
# floor-or-void and box height, and the importer round-robins envs over tiles. That is independent of
# how many solved MOTION cells exist -- 26 stair tiles replaying 8 (riser, tread) cells still present
# 26 different staircases to the camera. Transition stairs +6 per direction, jump_on +4,
# jump_off_front +4; flat, pure stairs and jump_off unchanged. Still 200 tiles x 50 clips.
#
# jump_off is NOT grown: it is in DEFAULT_SKIP_FAMILIES (it drops BACKWARDS off a box and no
# forward-facing camera sees it), so the generator never trains on it. It is not cut either -- the
# teacher does train on it and C++ clip playback keeps the family.
flat_tiles: 60

# ---------------------------------------------------------------- flat family
# The command schedule the flat clips are GENERATED with (mb_encode). Bands are explicit (min, max)
# ranges, not scale x fraction: the old form could not express a floor, which is why nothing below
# 0.45 m/s existed. walk and run are contiguous so forward speed covers [0.1, 3.0] with no hole,
# while keeping the 60/40 walk/run weighting.
flat_loops: true              # exact looped strides + bounded MB transients
flat_hold_s_range: [1.5, 4.0]  # s of STEADY loop per segment, before rounding to a gait phase
flat_stand_frac: 0.08          # chance a flat segment is a standing hold (entered via a transient)
flat_ramp_dv: 1.4              # max speed change per single in-betweening; bigger is split
flat_a_max: 1.15               # m/s^2; peak accel measures ~1.75x this
flat_min_transient_s: 0.35
flat_hop_slack: 1.15
flat_clip_length: 20.0          # s; every flat clip is this long, all real motion
flat_seg_dur_range: [1.5, 5.5]  # s per command segment
flat_walk_vx_range: [0.1, 1.0]  # also the base band for turn / diagonal segments
flat_run_vx_range: [1.0, 3.0]   # used on the 40% of forward segments that run
flat_back_vx_range: [0.1, 1.5]  # magnitudes; emitted as negative vx
flat_side_vy: 1.0               # lateral (sidestep) scale
flat_turn_max: 0.8              # yaw-rate scale (rad/s)

# ---------------------------------------------------------------- stair families
# vel_range feeds BOTH stair families: the transition tiles (mb_plan_library, via Motion Bricks) and
# the pure tiles (mb_pure_stair_clips, matcher-free). One band by construction -- they used to be
# two hand-matched grids kept equal by eye.
stair_vel_range: [0.2, 2.6]
stair_floor_frac: 0.5           # fraction of tiles with a flat ground plane under the stairs
stair_float_frac: 0.3           # fraction with FLOATING treads
stair_float_thick_range: [0.03, 0.06]
pure_seconds: 6.0               # pure-tile length in s at the stride's horizontal speed;
                                # the CLIP runs ~2x that (climbing covers ground more slowly)

# ---------------------------------------------------------------- box families
box_vel_range: [0.2, 3.5]       # GROUND-level run-up / walk-away band
box_top_vx_range: [0.2, 0.7]    # speed ON the box top
box_two_sided_frac: 0.5
box_nav_width: -1.0             # -1 = derive from the tile width
backward_vx_max: 1.0            # caps the band top for a BACKWARD family (jump_off)

# ---------------------------------------------------------------- shared terrain knobs
steady_approach_frac: 0.5       # fraction of terrain clips entered already walking (vs from a stand)
# The approach/exit are always [exact loop][bounded transient]; there is no other
# path, so there is no bounded_approach switch. The --ramp-s / --pin-cmd / --pin-lead
# knobs that used to sit here were inert on every driver run and are deleted.
approach_a_max: 2.0
approach_min_transient_s: 0.35
approach_hop_slack: 1.3

# ---------------------------------------------------------------- RL-visible command
terrain_cmd_changes_per_side: 2   # command changes during the lead-up / trail-away. 0 = the
                                  # pre-step-8 single hold. A CEILING: the travel budget decides how
                                  # many steady stretches actually fit. Each change is one extra MB
                                  # generation per clip, so 2 is ~3x the stage-b cost of 0.
min_hold_m: 1.5                   # shortest steady stretch (m) a hold may be. Below a gait cycle a
                                  # "hold" is not steady, and loop_frames_for rounds it UP -- which
                                  # overruns the travel budget and pushes terrain past the platform.
# The command written into the clip is TERRAIN-AGNOSTIC by design -- what a user or planner asked
# for, with no knowledge of the terrain -- while the reference motion is terrain-aware. Bridging
# that gap is what the flow model is for, so this is never derived from the motion.
segment_reuse: false            # share a generated MB segment between clips with identical
                                # conditioning. OFF: with per-clip schedules two clips are only
                                # interchangeable if their whole schedules match, and ~1.5x the
                                # segment cost buys "every clip's motion was generated for it"
rl_vels: raw                    # raw | snapped -- which velocity channel the flat clips carry

# ---------------------------------------------------------------- terrain tile geometry (pass A)
# The tile POPULATION and the gait phase each clip hands off at. Distribution parameters in the
# same sense the velocity bands are -- these used to reach a build only through mb_plan_library's
# argparse defaults, i.e. from a second place, which is the thing this file exists to prevent.
n_steps_range: [3, 7]            # treads per TRANSITION stair tile
tile_width_range: [0.8, 1.2]     # corridor width (m) per transition tile
entry_pick: sample               # which boundary-gate candidate the terrain entry hands off at.
                                 # 'sample' varies the gait phase per clip; a fixed preference
                                 # gives every clip sharing a reference the identical hand-off pose
exit_pick: first                 # stop as soon as a foot lands on the far surface -- never onto a
                                 # phantom tread past the end of the tile
contact_tol: 0.02                # m; sole-to-surface tolerance for a boundary candidate
swing_clear: null                # m; null derives it from the riser (min(0.05, 0.5*riser))
swing_band: null                 # m; null derives it from the riser (max(0.5*riser, clear+0.05))
footprint_margin: 1.0            # m added on all four sides of a tile's footprint

# ---------------------------------------------------------------- approach/exit travel budget (m)
# Stated in seconds and converted to a DISTANCE at each clip's own speed, then clamped in metres.
# A fixed distance makes a slow clip take proportionally longer (6 m at 0.2 m/s is 30 s); a fixed
# duration is what made the tile geometry speed-dependent -- platforms were duration x the tile's
# fastest clip, so a 3.5 s budget at 2.6 m/s authored a 10.1 m platform on BOTH ends of every
# transition tile. The clip keeps a duration; the tile only ever sees metres.
approach_flat_s_range: [1.5, 4.0]   # s of flat lead-in before the approach zone
exit_flat_s_range: [1.5, 4.0]       # s of flat trail-away after the terrain
flat_dist_clamp: [1.0, 6.0]         # m; bounds the converted distance at both ends of the band.
                                    # Widened 4.0 -> 6.0 for the command variation: after the 2 m
                                    # approach zone a 4 m flat lead-in can rarely fund a SECOND
                                    # steady stretch (one gait cycle plus the in-betweening that
                                    # reaches it), so only 8 of 32 quick-build plans got a command
                                    # change. At 6.0 that is 17 of 32. Measured cost: terrain tile
                                    # size_x p50 7.98 -> 9.07 m (+14%), max 18.13 -> 22.30. Step 6
                                    # had already taken 30-40% off the fast stair tiles by dropping
                                    # the speed term, so this spends part of that back deliberately.
dist_step: 0.25                     # m quantization, so segments can still be shared
platform_buffer_m: 1.0              # m of walkable surface past the nominal travel, so the
                                    # reference cannot walk off the far edge

# ---------------------------------------------------------------- the splice (pass C)
seams: ease                      # 'ease' inertializes the seam residual, 'weld' takes it rigidly,
                                 # 'auto' follows whatever stage 1 pinned for. A PINNED segment
                                 # spliced EASED is the measured best of the three
seam_blend_s: 0.25               # ease window (s) for terrain seams
weld_search: 12                  # frames searched for the best weld frame
arrival_search: 60               # trailing approach frames searched for the in-betweened arrival

# ---------------------------------------------------------------- pure stair tiles
# SEPARATE keys from the transition ones on purpose: the matcher-free path ships DIFFERENT
# geometry -- width (1.0, 1.6) against (0.8, 1.2), and (4, 10) treads against (3, 7). Sharing one
# key would have silently changed one of the two populations.
pure_end_buffer: 3               # treads of run-off kept past the traversal's end
pure_tile_width_range: [1.0, 1.6]
pure_n_steps_range: [4, 10]
pure_footprint_margin: 1.0

# ---------------------------------------------------------------- flat family assembly
flat_seam_blend_s: 0.24          # ease window (s) at loop<->transient seams. A loop's own period
                                 # seams need nothing -- the strides close bit-exactly
flat_anchor: "x,y,yaw"           # which DOFs the flat clips' ego anchor frees

# ---------------------------------------------------------------- segment generation
pin_future: auto                 # 'auto' follows each family's own pin_future (an ASCENT tracks the
                                 # replay's future so it arrives moving; a DESCENT holds the entry)

# ---------------------------------------------------------------- composition
extra_mix: ""                   # "path.h5:tiles, ..." for genuinely EXTERNAL families; the standard
                                # families (incl. pure stairs) are folded in automatically
