# CONFIG 4: MULTI-TERRAIN. Every tile type in one library, plus one the others do not have.
#
# The question this config exists to answer: does training on a MIX beat, match, or lose to
# training on each terrain alone? That is only readable if the eval breaks down per tile type,
# which is why the report grows a per-type section -- a pooled rate over a mix moves when the
# mix moves, with no policy change at all.
#
# THE ENTRY STAIRS are new to Isaac and ported from the MuJoCo scene
# (transfer/sim/robots/g1/g1_perceptive_entry_stairs_scene.xml, generated by
# generate_entry_stairs_scene.py from a MEASURED building entrance). It is the only tile with
# TWO FLIGHTS OF DIFFERENT GEOMETRY separated by a landing -- 5 x 6.0in/11.0in at 200in wide,
# a 100in landing, then 3 x 5.25in/13.0in in a 100in hallway -- so it is the only one that
# forces a re-plan into a second, different staircase and a narrowing corridor.
name: multi
task: G1-box2-finetune
clip: clips/ft_multi_train.h5
goals: logs/ft_multi/goal_regions.json

# 4000 / 1000, against 2000 / 500 for the single-terrain configs. Four tile types share one
# buffer, so the same churn would refresh a quarter as much of each type per iteration and the
# critic would be fitted to a policy several iterations stale on whichever type it saw least.
buffer: 4000
refresh: 1000
iters: 5
num_envs: 2048

# BALLAST: chunks from the ORIGINAL pre-training set, carried at weight 1.
#
# They are not graded, not fitted, and take no part in the advantage -- they exist so AWR
# pulling the generator toward one course cannot quietly cost it the distribution it was
# pre-trained on. `ballast_flat_frac` is the share drawn from FLAT windows specifically,
# because a terrain course contains none and flat is 30% of the pre-training library.
ballast_chunks: 2000
ballast_flat_frac: 0.5
# WHICH recording. The pre-training set the generator was actually fitted on -- the
# `recorded_*.h5` half of run_fm_pipeline.sh's output, NOT the augmented one: the augmented
# file is the same rollouts re-rendered with clutter, so drawing ballast from it would carry
# the augmentation's distribution rather than the pre-training one.
#
# A fine-tune `rollout_*.h5` is also accepted and is a different experiment: that is the
# PARENT's behaviour on whatever terrain it was collected on, where this is the data the
# generator was fitted on. `build_ballast_dataset` tells them apart by their arrays and reads
# each with its own loader -- they end as the same four tensors in the same loss.
#
# The v6g pre-training set: 200k windows, the `recorded_` half of the run_fm_pipeline pass
# started 2026-09-12 against tracker 2026-09-11_11-45-14_paper_v6g_v1. Its family split is
# 30.5% unknown (= flat) and the rest real terrain families, which is what makes a declared
# ballast_flat_frac of 0.5 achievable here.
#
# It must stay the recording whose generator `--pretrained` names, or the ballast anchors the
# fine-tune to a distribution that generator was never fitted on.
ballast_rollout: "logs/rsl_rl/g1/2026-09-11_11-45-14_paper_v6g_v1/recorded_data/recorded_20260912_090151.h5"

# 4 types, 70 tiles. The entry stairs split 5 ASCENDING / 5 DESCENDING.
#
# Read this count as a SAMPLING WEIGHT, not as variety. The other three types draw fresh
# geometry per tile, so their counts buy coverage of a distribution. The entry stairs are one
# measured building and the tile draws nothing, so all 5 tiles of a direction are identical and
# what the count buys is ENV SHARE -- envs are placed round-robin over tiles, so 10 of 70 tiles
# is 14% of training time and 14% of the episodes the per-type breakdown gets to reduce over.
#
# 5 rather than 3 because 3 tiles is a thin slice to read a per-type success rate off, and this
# is the type the config exists to test: it is the only tile with two flights of DIFFERENT
# geometry, and the only one that meets a narrowing corridor before a riser.
#
# The two directions are separate families and must stay separate in the breakdown. Climbing a
# flight you can see and descending one whose treads fall away below the camera are the stack's
# easiest and hardest stair modes -- STAIRS DOWN BAD is the standing hardware finding -- so a
# pooled entry-stairs rate would move with the up/down mix rather than with the policy.
tiles_boxes: 20
tiles_updown: 20
tiles_indist: 20
tiles_entry_stairs: 10

updown_cells: [[0.130, 0.280], [0.130, 0.305], [0.130, 0.330],
               [0.155, 0.280], [0.155, 0.305], [0.155, 0.330],
               [0.180, 0.280], [0.180, 0.305], [0.180, 0.330]]
updown_measured_cells: [[0.1397, 0.3175], [0.1778, 0.3048], [0.1270, 0.3302]]
updown_measured_frac: 0.34
updown_steps_range: [1, 10]
updown_width_range_m: [1.219, 3.048]
updown_platform_range_m: [1.50, 3.00]
updown_wall_height_range_m: [1.2, 2.4]

boxes_per_tile_range: [1, 2]
box_height_range_m: [0.25, 0.75]
box_depth_range_m: [0.45, 1.40]
box_width_range_m: [1.20, 4.00]
box_gap_range_m: [1.50, 4.00]

# 0.4 m/s at the low end is BELOW the trained distribution and that is deliberate. The
# library's own stair grid is a uniform 0.600 .. 2.600 over 3500 clips
# (`fm_tracking_cmd_cfg.freeform_speed_min`), so 0.6 was the slowest command the tracker or
# the generator ever saw. Extending down to 0.4 probes the slow end the same way 2.5 probes
# the fast one -- but a failure at 0.4 is a distribution statement first and a capability
# statement second, so read the per-speed breakdown rather than the pooled rate.
#
# Stamped into the library at build and read back by run_finetune_loop.sh via
# `clip_io.read_commanded_speed_range`, so CHANGING THIS REQUIRES REBUILDING THE LIBRARY --
# the band travels in the .h5, not in the launcher.
commanded_speed_range_mps: [0.4, 2.5]
seed: 0
